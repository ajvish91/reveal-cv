[metadata]
name = job-search-automation
version = 0.1.0

[options]
packages = find:
python_requires = >=3.10
install_requires =
    pyyaml>=6.0.1
    pypdf>=4.0.0
    certifi>=2024.0.0
    streamlit>=1.32.0
    pandas>=2.0.0

[options.packages.find]
where = .
include = shared*, job_search*, cv_generation*

[options.entry_points]
console_scripts =
    ingest-nav-jobs = job_search.ingest_nav_jobs:main
    score-jobs = job_search.score_jobs:main
    job-dashboard = job_search.dashboard:main
    run-cv-tailoring = cv_generation.run_cv_tailoring:main
