[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-automation"
version = "0.1.0"
description = "NAV job search pipeline and CV tailoring tooling"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "pypdf>=4.0.0",
    "certifi>=2024.0.0",
    "selectolax>=0.3.21",
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
]

[tool.setuptools]
py-modules = ["repo_paths"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "job_search*", "cv_generation*"]

[project.scripts]
ingest-nav-jobs = "job_search.ingest_nav_jobs:main"
ingest-finn-jobs = "job_search.ingest_finn_jobs:main"
score-jobs = "job_search.score_jobs:main"
job-dashboard = "job_search.dashboard:main"
run-cv-tailoring = "cv_generation.run_cv_tailoring:main"
